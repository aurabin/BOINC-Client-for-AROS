name: AROS cross-compiler for Windows x64
on:
  push:
    branches: [build/aros-cross-compiler-windows-x64]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: base-devel autoconf automake libtool texinfo git curl wget unzip zip patch mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-mako mingw-w64-ucrt-x86_64-python-yaml mingw-w64-ucrt-x86_64-libpng mingw-w64-ucrt-x86_64-libiconv mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Install Netpbm host utilities
        shell: msys2 {0}
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          cd "$download_dir"
          trap 'cd /tmp && rm -f -- "$download_dir/netpbm-bin.zip" "$download_dir/netpbm-dep.zip" && rmdir -- "$download_dir"' EXIT
          curl -fsSL --retry 4 https://downloads.sourceforge.net/project/gnuwin32/netpbm/10.27/netpbm-10.27-bin.zip -o netpbm-bin.zip
          curl -fsSL --retry 4 https://downloads.sourceforge.net/project/gnuwin32/netpbm/10.27/netpbm-10.27-dep.zip -o netpbm-dep.zip
          printf '%s  %s\n' 747f3067bd77533b4b6da2c8e73a5ff4 netpbm-bin.zip 9ff1d619e241e4ee3558a850440b26c0 netpbm-dep.zip | md5sum -c
          unzip -oq netpbm-bin.zip -d /tmp/aros-netpbm
          unzip -oq netpbm-dep.zip -d /tmp/aros-netpbm
          /tmp/aros-netpbm/bin/pngtopnm.exe -version
          test -f /tmp/aros-netpbm/bin/ppmtoilbm.exe
      - name: Build upstream GNU tools for AROS x86-64
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/tmp/aros-netpbm/bin:$PATH"
          mkdir -p logs
          cd /tmp
          git init aros-src
          git -C aros-src config core.autocrlf false
          git -C aros-src remote add origin https://github.com/aros-development-team/AROS.git
          git -C aros-src fetch --depth=1 origin ddc6446f762e36a9070f300a457d03e6f137f7d3
          git -C aros-src checkout --detach FETCH_HEAD
          # FlexCat uses MinGW's external iconv. Keep the library after its objects.
          recipe=aros-src/tools/flexcat/src/Makefile.aros
          grep -Fq -- '$(HOST_LDFLAGS) $^ -o $@' "$recipe"
          sed -i 's/$(HOST_LDFLAGS) \$\^ -o \$@/& -liconv/' "$recipe"
          grep -Fq -- '$^ -o $@ -liconv' "$recipe"
          # MinGW mkdir takes a path only. Apply this change to the Windows checkout.
          parser=aros-src/tools/parseoffsets/parsendkoffsets.c
          old='mkdir (path, S_IRWXU | S_IRWXG | S_IROTH | S_IXOTH);'
          grep -Fq -- "$old" "$parser"
          sed -i "s/$old/mkdir (path);/" "$parser"
          grep -Fq -- 'mkdir (path);' "$parser"
          # Autoconf must resolve MetaMake's auxiliary files in MSYS path syntax.
          for auxiliary in install-sh config.guess config.sub; do
            test -s "aros-src/tools/MetaMake/$auxiliary"
          done
          export PYTHON="$(cygpath -m /ucrt64/bin/python.exe)"
          "$PYTHON" - <<'PY'
          from pathlib import Path
          makefile = Path("aros-src/Makefile.in")
          source = makefile.read_bytes()
          old = b"$(GENDIR)/tools/MetaMake/configure --prefix=$(TOOLDIR)"
          new = ('sh ../../bin/pc-x86_64/gen/tools/MetaMake/configure '
                 '--srcdir=../../bin/pc-x86_64/gen/tools/MetaMake '
                 '--build=x86_64-w64-mingw32 --host=x86_64-w64-mingw32 '
                 '--prefix=$(TOOLDIR)')
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one MetaMake configure invocation")
          makefile.write_bytes(source.replace(old, new.encode("ascii")))
          fetch = Path("aros-src/scripts/fetch.sh")
          source = fetch.read_bytes()
          anchor = b"# Ensure LOCATION, destination, and BASE are absolute paths."
          if source.count(anchor) != 1:
              raise SystemExit("Unexpected archive path normalization")
          normalize = (
              b'if command -v cygpath >/dev/null 2>&1; then\n'
              b'    LOCATION=$(cygpath -au "$LOCATION") || exit 1\n'
              b'    destination=$(cygpath -au "$destination") || exit 1\n'
              b'    BASE=$(cygpath -au "$BASE") || exit 1\n'
              b'fi\n\n'
          )
          fetch.write_bytes(source.replace(anchor, normalize + anchor))
          mmake = Path("aros-src/tools/MetaMake/mmake.c")
          source = mmake.read_bytes()
          for old, new in (
              (b'setenv("_MMAKE_TARGET", tname, 1);', b'_putenv_s("_MMAKE_TARGET", tname);'),
              (b'unsetenv("_MMAKE_TARGET");', b'_putenv_s("_MMAKE_TARGET", "");'),
          ):
              if source.count(old) != 1:
                  raise SystemExit("Unexpected MetaMake environment-variable code")
              source = source.replace(old, new)
          mmake.write_bytes(source)
          PY
          mkdir aros-build
          cd aros-build
          logdir="$(cygpath -u "$GITHUB_WORKSPACE")/logs"
          command -v aclocal autoconf autoheader automake pngtopnm ppmtoilbm
          "$PYTHON" -c 'import mako.template, yaml'
          # Validate both imports above before supplying Autoconf's module results.
          export pc_cv_python_module_mako=yes pc_cv_python_module_yaml=yes
          ../aros-src/configure --host=x86_64-w64-mingw32 --build=x86_64-w64-mingw32 --target=pc-x86_64 --with-toolchain=gnu 2>&1 | tee "$logdir/configure.log"
          make -j"$(nproc)" PYTHON="$PYTHON" crosstools-toolchain 2>&1 | tee "$logdir/build.log"
      - name: Test Windows executable and package toolchain
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cc=$(find /tmp/aros-build/bin -type f -name x86_64-aros-gcc.exe -print -quit)
          test -n "$cc"
          test "$("$cc" -dumpmachine)" = x86_64-aros
          probe_dir="$(mktemp -d)"
          trap 'rm -f -- "$probe_dir/smoke.c" "$probe_dir/smoke.o"; rmdir -- "$probe_dir"' EXIT
          printf 'int aros_smoke(void) { return 0; }\n' > "$probe_dir/smoke.c"
          "$cc" -ffreestanding -c "$probe_dir/smoke.c" -o "$probe_dir/smoke.o"
          readelf -h "$probe_dir/smoke.o"
          cp -a "$(dirname "$cc")" aros-cross-compiler
          for dll in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            cp "/ucrt64/bin/$dll" aros-cross-compiler/
          done
          zip -qr aros-cross-compiler-windows-x64.zip aros-cross-compiler
          sha256sum aros-cross-compiler-windows-x64.zip > aros-cross-compiler-windows-x64.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aros-cross-compiler-windows-x64
          path: |
            aros-cross-compiler-windows-x64.zip
            aros-cross-compiler-windows-x64.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aros-windows-build-logs
          path: logs/
